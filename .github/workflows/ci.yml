name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder is configured with electronDist: node_modules/electron/dist, so the binary must exist.
      - name: Ensure the Electron binary is downloaded
        shell: bash
        run: test -f node_modules/electron/dist/electron.exe || node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the main bundle only imports declared dependencies
        run: npx tsx scripts/check-main-deps.ts

  package:
    name: Package (unpacked app, no publish)
    needs: verify
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Ensure the Electron binary is downloaded
        shell: bash
        run: test -f node_modules/electron/dist/electron.exe || node node_modules/electron/install.js

      - name: Build the unpacked Windows app
        run: npm run dist:dir
