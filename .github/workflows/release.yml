name: Release

# Three ways to release:
#  1. Automatic: every push to main (code changes only) picks a bump from the commit messages since the last tag
#     (feat -> minor, anything else -> patch; breaking changes stay minor until 1.0), bumps package.json, tags, builds and publishes.
#     Put [skip release] in a commit message to opt out.
#  2. Push a tag that matches package.json, e.g. `npm version minor && git push --follow-tags`.
#  3. Run this workflow manually from main and pick a bump.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/workflows/ci.yml']
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (creates the version commit and the tag on main)
        type: choice
        options: [patch, minor, major, prerelease]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build installer and publish GitHub release
    runs-on: windows-latest
    timeout-minutes: 60
    # The bump commit is pushed with GITHUB_TOKEN, which does not retrigger workflows; this guard is belt and braces.
    if: >-
      github.event_name != 'push' || github.ref_type == 'tag' ||
      (!startsWith(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, '[skip release]'))
    steps:
      - name: Refuse manual runs from anything but main
        if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Manual releases must run from main (got $GITHUB_REF)." >&2
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Bump version, commit and tag (branch runs only)
        if: github.ref_type == 'branch'
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ -z "$BUMP" ]; then
            LAST=$(git describe --tags --abbrev=0 2>/dev/null || true)
            RANGE=${LAST:+$LAST..HEAD}
            if git log --format=%s $RANGE | grep -qE '^feat(\(.+\))?!?:|!:'; then BUMP=minor; else BUMP=patch; fi
            echo "Auto bump: $BUMP"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP" -m "chore(release): %s"
          git push origin HEAD:main --follow-tags

      - name: Resolve version and check the tag
        id: ver
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$TAG" ]; then
            echo "Tag $REF_NAME does not match package.json version $VERSION (expected $TAG)." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          case "$VERSION" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Ensure the Electron binary is downloaded
        shell: bash
        run: test -f node_modules/electron/dist/electron.exe || node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the main bundle only imports declared dependencies
        run: npx tsx scripts/check-main-deps.ts

      # dist:win runs electron-vite build and then electron-builder with --publish never.
      - name: Build the NSIS installer
        run: npm run dist:win

      - name: Checksum
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd dist
          ls -l "ccwraper-Setup-$VERSION.exe"
          # electron-updater needs latest.yml and the blockmap next to the installer.
          ls -l latest.yml "ccwraper-Setup-$VERSION.exe.blockmap"
          sha256sum "ccwraper-Setup-$VERSION.exe" > "ccwraper-Setup-$VERSION.exe.sha256"
          cat "ccwraper-Setup-$VERSION.exe.sha256"

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRE: ${{ steps.ver.outputs.prerelease }}
        run: |
          gh release create "$TAG" \
            "dist/ccwraper-Setup-$VERSION.exe" \
            "dist/ccwraper-Setup-$VERSION.exe.sha256" \
            "dist/ccwraper-Setup-$VERSION.exe.blockmap" \
            "dist/latest.yml" \
            --title "ccwraper $TAG" \
            --generate-notes \
            --verify-tag \
            $PRE
